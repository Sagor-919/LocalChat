<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="local_chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Local Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f5f5fa; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121214; }
    }
    #lc-pre-splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6b6b73; transition: opacity 240ms ease;
    }
    #lc-pre-splash.lc-hidden { opacity: 0; pointer-events: none; }
    #lc-pre-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,0.10); }
    #lc-pre-splash h1 { font-size: 22px; font-weight: 800; margin: 18px 0 14px; color: #101012; }
    @media (prefers-color-scheme: dark) {
      #lc-pre-splash h1 { color: #f1f1f5; }
      #lc-pre-splash { color: #aaa; }
    }
    .lc-bar {
      width: 140px; height: 3px; background: rgba(63,81,181,0.18);
      border-radius: 99px; overflow: hidden; position: relative;
    }
    .lc-bar::after {
      content: ""; position: absolute; left: -40%; top: 0; bottom: 0; width: 40%;
      background: #3f51b5; border-radius: 99px;
      animation: lc-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes lc-slide {
      0% { left: -40%; } 100% { left: 100%; }
    }
    .lc-msg { margin-top: 12px; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <!--
    Native pre-Flutter splash so cold load doesn't show a blank white page
    while flutter_bootstrap.js downloads and the engine starts. Removed by
    [main.dart] right after the Flutter first frame paints.
  -->
  <div id="lc-pre-splash">
    <img src="icons/Icon-192.png" alt="Local Chat" onerror="this.style.display='none'"/>
    <h1>Local Chat</h1>
    <div class="lc-bar"></div>
    <div class="lc-msg">Loading…</div>
  </div>
  <script>
    // Hide the pre-splash once Flutter signals first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('lc-pre-splash');
      if (!el) return;
      el.classList.add('lc-hidden');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
