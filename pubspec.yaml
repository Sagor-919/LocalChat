name: local_chat
description: "Local Chat — Simplified LAN Messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  file_picker: ^10.3.10
  open_filex: ^4.7.0
  desktop_drop: ^0.7.0
  flutter_local_notifications: ^19.4.0
  image_picker: ^1.2.1
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  permission_handler: ^11.4.0
  network_info_plus: ^7.0.0
  super_clipboard: ^0.9.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+2
  synchronized: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/developer_avatar.png
    - windows/runner/resources/app_icon.ico

flutter_launcher_icons:
  android: true
  image_path: assets/app_icon.png
  windows:
    generate: true
    image_path: assets/app_icon.png
  macos:
    generate: true
    image_path: assets/app_icon.png
